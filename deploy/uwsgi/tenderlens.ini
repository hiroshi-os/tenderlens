[uwsgi]
project = /opt/tenderlens
chdir = %(project)
module = config.wsgi:application
master = true
processes = 4
socket = /run/tenderlens/uwsgi.sock
chmod-socket = 660
vacuum = true
die-on-term = true
uid = www-data
gid = www-data
harakiri = 60
max-requests = 1000
env = DJANGO_SETTINGS_MODULE=config.settings
