# /etc/nginx/sites-available/tenderlens
# Symlink into sites-enabled and reload nginx after the socket exists.

upstream tenderlens {
    server unix:/run/tenderlens/uwsgi.sock;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /static/ {
        alias /opt/tenderlens/staticfiles/;
        expires 7d;
    }

    location /healthz {
        include uwsgi_params;
        uwsgi_pass tenderlens;
        access_log off;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass tenderlens;
    }
}
