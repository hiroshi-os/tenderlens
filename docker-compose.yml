services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tenderlens
      POSTGRES_USER: tenderlens
      POSTGRES_PASSWORD: tenderlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderlens -d tenderlens"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://tenderlens:tenderlens@db:5432/tenderlens
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker --loglevel=info
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://tenderlens:tenderlens@db:5432/tenderlens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat --loglevel=info
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://tenderlens:tenderlens@db:5432/tenderlens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
